<svg xmlns="http://www.w3.org/2000/svg" width="630" height="500" viewBox="0 0 630 500">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="abyss" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#2a0845" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7b6b"/>
      <stop offset="40%" stop-color="#6b5b4b"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a0ff"/>
      <stop offset="100%" stop-color="#7b2fbe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="630" height="500" fill="url(#glow)"/>
  <rect width="630" height="500" fill="url(#abyss)"/>

  <!-- Stars -->
  <circle cx="50" cy="30" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="150" cy="55" r="0.8" fill="#fff" opacity="0.5"/>
  <circle cx="280" cy="20" r="1.2" fill="#c8a0ff" opacity="0.6"/>
  <circle cx="400" cy="40" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="520" cy="25" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="580" cy="60" r="0.7" fill="#c8a0ff" opacity="0.5"/>
  <circle cx="100" cy="80" r="0.6" fill="#fff" opacity="0.3"/>
  <circle cx="470" cy="70" r="0.9" fill="#fff" opacity="0.4"/>
  <circle cx="350" cy="50" r="1" fill="#fff" opacity="0.5"/>

  <!-- Cave walls left -->
  <polygon points="0,120 0,500 80,500 60,420 40,350 70,300 30,250 55,200 20,160" fill="#1a1410" stroke="#2a2018" stroke-width="1"/>
  <polygon points="0,150 0,500 50,500 35,400 55,340 25,280 45,220 15,180" fill="#221a12" stroke="#332818" stroke-width="0.5"/>

  <!-- Cave walls right -->
  <polygon points="630,120 630,500 550,500 570,420 590,350 560,300 600,250 575,200 610,160" fill="#1a1410" stroke="#2a2018" stroke-width="1"/>
  <polygon points="630,150 630,500 580,500 595,400 575,340 605,280 585,220 615,180" fill="#221a12" stroke="#332818" stroke-width="0.5"/>

  <!-- Stalactites -->
  <polygon points="120,120 135,185 110,120" fill="#1a1410"/>
  <polygon points="200,100 210,160 190,100" fill="#221a12"/>
  <polygon points="430,110 440,170 420,110" fill="#1a1410"/>
  <polygon points="500,105 515,175 490,105" fill="#221a12"/>
  <polygon points="310,95 320,140 300,95" fill="#1a1410"/>

  <!-- Crystal formations (purple) -->
  <g filter="url(#softGlow)" opacity="0.8">
    <polygon points="85,350 95,290 105,350" fill="url(#crystalGrad)" opacity="0.6"/>
    <polygon points="95,360 110,310 120,360" fill="url(#crystalGrad)" opacity="0.4"/>
    <polygon points="525,340 535,280 545,340" fill="url(#crystalGrad)" opacity="0.6"/>
    <polygon points="540,355 550,300 560,355" fill="url(#crystalGrad)" opacity="0.4"/>
  </g>

  <!-- Abyss chasm -->
  <ellipse cx="315" cy="460" rx="200" ry="50" fill="#050005" stroke="#2a0845" stroke-width="1" opacity="0.8"/>
  <ellipse cx="315" cy="460" rx="140" ry="35" fill="#000" opacity="0.9"/>

  <!-- Purple mist rising from abyss -->
  <g filter="url(#softGlow)" opacity="0.3">
    <ellipse cx="280" cy="430" rx="40" ry="15" fill="#7b2fbe"/>
    <ellipse cx="350" cy="420" rx="30" ry="12" fill="#9b4fde"/>
    <ellipse cx="315" cy="410" rx="50" ry="18" fill="#6b1fae"/>
    <ellipse cx="300" cy="390" rx="25" ry="10" fill="#8b3fce" opacity="0.5"/>
    <ellipse cx="340" cy="385" rx="20" ry="8" fill="#7b2fbe" opacity="0.4"/>
  </g>

  <!-- Silhouette figure at edge of abyss -->
  <g transform="translate(315,370)">
    <!-- Body -->
    <rect x="-4" y="-35" width="8" height="25" fill="#0a0a0a"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="7" fill="#0a0a0a"/>
    <!-- Hood -->
    <path d="M-9,-38 L0,-48 L9,-38 Q9,-33 7,-30 L-7,-30 Q-9,-33 -9,-38Z" fill="#111"/>
    <!-- Cloak -->
    <path d="M-6,-10 L-12,0 L12,0 L6,-10Z" fill="#0a0a0a"/>
    <!-- Subtle glow around figure -->
    <circle cx="0" cy="-30" r="20" fill="#7b2fbe" opacity="0.05" filter="url(#softGlow)"/>
  </g>

  <!-- Main title: Chinese -->
  <text x="315" y="175" text-anchor="middle" font-family="serif" font-size="72" font-weight="bold" fill="#c8a0ff" filter="url(#textGlow)" letter-spacing="20">
    石化深淵
  </text>

  <!-- Decorative line -->
  <line x1="165" y1="200" x2="465" y2="200" stroke="#7b2fbe" stroke-width="1" opacity="0.6"/>
  <circle cx="315" cy="200" r="3" fill="#c8a0ff" opacity="0.8"/>
  <circle cx="165" cy="200" r="2" fill="#7b2fbe" opacity="0.6"/>
  <circle cx="465" cy="200" r="2" fill="#7b2fbe" opacity="0.6"/>

  <!-- Subtitle: English -->
  <text x="315" y="235" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#9a7bbb" letter-spacing="8" filter="url(#textGlow)">
    PETRIFICATION ABYSS
  </text>

  <!-- Tagline -->
  <text x="315" y="275" text-anchor="middle" font-family="serif" font-size="16" fill="#6b5b8b" letter-spacing="4" opacity="0.8">
    ── 文 字 冒 險 ──
  </text>

  <!-- Terminal-style decorative elements -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#4a3a5a" opacity="0.4">
    <text x="30" y="490">&gt; enter the depths_</text>
    <text x="430" y="490">v1.0 | zh-TW / EN</text>
  </g>

  <!-- Border frame -->
  <rect x="8" y="8" width="614" height="484" fill="none" stroke="#2a1845" stroke-width="1.5" rx="2" opacity="0.5"/>
  <rect x="12" y="12" width="606" height="476" fill="none" stroke="#1a0a2e" stroke-width="0.5" rx="1" opacity="0.3"/>
</svg>
