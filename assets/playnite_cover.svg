<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <radialGradient id="sky" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#22103a"/>
      <stop offset="48%" stop-color="#140b22"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="abyssGlow" cx="50%" cy="78%" r="58%">
      <stop offset="0%" stop-color="#3c0a62" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1a0530" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4f47"/>
      <stop offset="50%" stop-color="#3a322c"/>
      <stop offset="100%" stop-color="#15110d"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2822"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e0ff"/>
      <stop offset="45%" stop-color="#b06bf0"/>
      <stop offset="100%" stop-color="#5e1f9e"/>
    </linearGradient>
    <linearGradient id="figGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3344"/>
      <stop offset="55%" stop-color="#1a1622"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8a0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c8a0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="botShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="titleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect width="600" height="900" fill="url(#sky)"/>
  <ellipse cx="300" cy="760" rx="380" ry="300" fill="url(#abyssGlow)"/>
  <circle cx="300" cy="640" r="200" fill="url(#halo)" filter="url(#softBig)" opacity="0.6"/>

  <!-- chasm walls -->
  <path d="M0,180 L150,160 L95,420 L150,640 L70,900 L0,900 Z" fill="url(#stoneDark)"/>
  <path d="M0,260 L95,250 L60,520 L110,760 L40,900 L0,900 Z" fill="url(#stone)" opacity="0.8"/>
  <path d="M600,180 L450,160 L505,420 L450,640 L530,900 L600,900 Z" fill="url(#stoneDark)"/>
  <path d="M600,260 L505,250 L540,520 L490,760 L560,900 L600,900 Z" fill="url(#stone)" opacity="0.8"/>

  <!-- crystal veins -->
  <g opacity="0.9">
    <polygon points="92,360 116,322 108,440 80,408" fill="url(#crystal)" filter="url(#soft)"/>
    <polygon points="70,600 96,560 86,700 58,664" fill="url(#crystal)" filter="url(#soft)"/>
    <polygon points="508,400 484,360 496,500 524,460" fill="url(#crystal)" filter="url(#soft)"/>
    <polygon points="520,640 496,604 506,740 540,700" fill="url(#crystal)" filter="url(#soft)"/>
  </g>

  <!-- central petrified figure, crystal-lit -->
  <g transform="translate(300,560)">
    <ellipse cx="0" cy="0" rx="120" ry="150" fill="url(#halo)" filter="url(#softBig)" opacity="0.55"/>
    <g fill="url(#figGrad)">
      <ellipse cx="0" cy="-150" rx="40" ry="46"/>
      <path d="M-48,-112 Q0,-132 48,-112 L66,150 Q0,176 -66,150 Z"/>
      <rect x="-80" y="-104" width="34" height="210" rx="16" transform="rotate(14 -62 0)"/>
      <rect x="46" y="-104" width="34" height="210" rx="16" transform="rotate(-14 62 0)"/>
    </g>
    <!-- crystal rim light along the figure -->
    <path d="M-48,-112 Q0,-132 48,-112 L40,-40 Q0,-22 -40,-40 Z" fill="url(#crystal)" opacity="0.22" filter="url(#soft)"/>
    <!-- petrified cracks glowing -->
    <g stroke="#b06bf0" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M-16,-150 l10,12 l-8,16"/>
      <path d="M14,-40 l-10,16 l8,20 l-6,18"/>
      <path d="M-22,30 l12,16 l-8,22"/>
    </g>
  </g>

  <!-- falling dust -->
  <g fill="#c8a0ff">
    <circle cx="180" cy="300" r="2" opacity="0.6"/>
    <circle cx="420" cy="260" r="1.6" opacity="0.5"/>
    <circle cx="300" cy="360" r="1.5" opacity="0.45"/>
    <circle cx="240" cy="430" r="1.4" opacity="0.4"/>
    <circle cx="380" cy="420" r="1.6" opacity="0.5"/>
    <circle cx="150" cy="500" r="1.4" opacity="0.4"/>
    <circle cx="450" cy="520" r="1.5" opacity="0.45"/>
  </g>

  <!-- top & bottom shades for legibility -->
  <rect x="0" y="0" width="600" height="280" fill="url(#topShade)"/>
  <rect x="0" y="560" width="600" height="340" fill="url(#botShade)"/>

  <!-- title -->
  <g filter="url(#titleGlow)" text-anchor="middle" font-family="'WenQuanYi Zen Hei','Noto Serif CJK TC',serif">
    <text x="300" y="120" font-size="92" font-weight="700" letter-spacing="10"
          fill="#efe6ff" opacity="0.98">石化深淵</text>
    <text x="300" y="170" font-size="27" font-weight="400" letter-spacing="17"
          fill="#b487e8" opacity="0.92">P E T R I A B Y S S</text>
    <text x="300" y="858" font-size="22" font-weight="400" letter-spacing="6"
          fill="#9a86b8" opacity="0.85">文字冒險 RPG · TEXT ADVENTURE</text>
  </g>
</svg>
