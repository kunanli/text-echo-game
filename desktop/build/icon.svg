<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#241038"/>
      <stop offset="60%" stop-color="#110a1e"/>
      <stop offset="100%" stop-color="#050309"/>
    </radialGradient>
    <linearGradient id="cry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e0ff"/>
      <stop offset="40%" stop-color="#bd7bf2"/>
      <stop offset="100%" stop-color="#5e1f9e"/>
    </linearGradient>
    <linearGradient id="cryDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a5cd6"/>
      <stop offset="100%" stop-color="#3a116b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8a0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c8a0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- halo -->
  <circle cx="256" cy="248" r="170" fill="url(#halo)" filter="url(#glow)" opacity="0.7"/>

  <!-- crystal shard (faceted diamond) -->
  <g>
    <polygon points="256,70 330,210 256,440 182,210" fill="url(#cry)"/>
    <polygon points="256,70 256,440 182,210" fill="url(#cryDark)" opacity="0.55"/>
    <polygon points="256,70 330,210 256,250" fill="#ffffff" opacity="0.35"/>
    <polygon points="182,210 256,250 256,440" fill="#2c0f55" opacity="0.4"/>
    <line x1="182" y1="210" x2="330" y2="210" stroke="#e7d4ff" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- stone cracks creeping up the crystal -->
  <g stroke="#1a0c2e" stroke-width="5" fill="none" opacity="0.65" stroke-linecap="round">
    <path d="M236,300 l16,18 l-12,22"/>
    <path d="M276,340 l-14,16 l10,20"/>
  </g>
</svg>
