<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Endcard Preview</title>
<style>
  body {
    background: #111;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    padding: 24px;
    font-family: sans-serif;
    color: #aaa;
  }
  .card-group { text-align: center; }
  .card-group h3 { margin: 0 0 8px; font-size: 13px; }
  canvas { border: 1px solid #333; }
</style>
</head>
<body>
<script>
// Mock globals needed by endcard.js
function notify() {}
function formatTime(ms) {
  var s = Math.floor(ms/1000), m = Math.floor(s/60), h = Math.floor(m/60);
  return (h?h+'h ':'') + (m%60)+'m ' + (s%60)+'s';
}
var globalStats = { currentRunStartMs: Date.now() - 3600000 };
</script>
<script>
// Mock state (will be overwritten per card)
var state = {
  name: '石隱', sex: 'male',
  hp: 72, maxHp: 100, petri: 18,
  str: 9, agi: 7, wil: 8,
  xp: 0, level: 6, xpToNext: 100,
  inventory: ['石刃','火把','藥草','灰鶴匕首','鐵盾'],
  region: 3, node: 'end',
  flags: { r3Ending: 'dawn' },
  deathCount: 0,
  lang: 'zh',
  mood: 'normal',
};
</script>
<script src="js/endcard.js"></script>
<script>
// Generate all 4 endings × 2 genders
var endings = ['dawn', 'sacrifice', 'compromise', 'lockdown'];
var endingConfigs = {
  dawn: { deathCount: 0, petri: 8, level: 8, str: 9, agi: 8, wil: 9,
    inventory: ['a','b','c','d','e','f','g','h','i','j'],
    flags: { r1YingCompanion: true, r3ZhouMet: true, r3BellMet: true, r3CraneMet3: true,
             r3PlagueProof: true, r3CraneTestimony: true, r3BellAlliance: true, r3CouncilEntry: true }},
  sacrifice: { deathCount: 1, petri: 25, level: 5, str: 7, agi: 6, wil: 8,
    inventory: ['a','b','c','d'],
    flags: { r1YingCompanion: true, r3ZhouMet: true, r3PlagueProof: true }},
  compromise: { deathCount: 2, petri: 40, level: 4, str: 6, agi: 7, wil: 5,
    inventory: ['a','b'],
    flags: { r3BellMet: true, r3BellAlliance: true }},
  lockdown: { deathCount: 5, petri: 65, level: 3, str: 5, agi: 5, wil: 5,
    inventory: ['a'],
    flags: {}},
};

endings.forEach(function(ending) {
  ['male', 'female'].forEach(function(sex) {
    var cfg = endingConfigs[ending];
    state.sex = sex;
    state.name = sex === 'male' ? '石隱' : '月影';
    state.deathCount = cfg.deathCount;
    state.petri = cfg.petri;
    state.level = cfg.level;
    state.str = cfg.str;
    state.agi = cfg.agi;
    state.wil = cfg.wil;
    state.inventory = cfg.inventory.slice();
    state.flags = {};
    for (var k in cfg.flags) state.flags[k] = cfg.flags[k];
    state.flags.r3Ending = ending;

    var canvas = generateEndCard();
    var score = calculateEndScore();
    var rarity = getRarity(score);

    var div = document.createElement('div');
    div.className = 'card-group';
    var h3 = document.createElement('h3');
    h3.textContent = ending + ' / ' + sex + ' — score: ' + score + ' [' + rarity.en + ']';
    div.appendChild(h3);
    canvas.style.width = '300px';
    canvas.style.height = '400px';
    div.appendChild(canvas);
    document.body.appendChild(div);
  });
});
</script>
</body>
</html>
